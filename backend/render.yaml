services:
  - type: web
    name: planetes-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: KEEPTRACK_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
